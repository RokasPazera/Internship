services:
  influxdb:
    image: influxdb:2.7.6
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME_FILE=/run/secrets/influxdb2-admin-username
      - DOCKER_INFLUXDB_INIT_PASSWORD_FILE=/run/secrets/influxdb2-admin-password
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE=/run/secrets/influxdb2-admin-token
      - DOCKER_INFLUXDB_INIT_ORG=Riwo
      - DOCKER_INFLUXDB_INIT_BUCKET=triomatic-data
    secrets:
      - influxdb2-admin-username
      - influxdb2-admin-password
      - influxdb2-admin-token
    volumes:
      - type: volume
        source: influxdb2-data
        target: /var/lib/influxdb2
      - type: volume
        source: influxdb2-config
        target: /etc/influxdb2
  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - type: volume
        source: chromadb-data
        target: /chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  chromadb-seed:
    build: ./code/chromadb
    container_name: chromadb-seed
    command: ["python", "seeding.py"]
    depends_on:
      chromadb:
        condition: service_healthy
    environment:
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    volumes:
      - ./code/chromadb/testpdf:/app/testpdf:ro
      - type: volume
        source: chromadb-onnx-cache
        target: /root/.cache/chroma

  chromadb-client:
    build: ./code/chromadb
    container_name: chromadb-client
    command: ["python", "db.py"]
    depends_on:
      chromadb-seed:
        condition: service_completed_successfully
    environment:
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000

  influxdb-seed:
    build: ./code/influxdb
    container_name: influxdb-seed
    command: ["python", "seeding.py"]
    depends_on:
      - influxdb
    env_file:
      - ./code/.env
    environment:
      - INFLUXDB_URL=http://influxdb:8086

  influxdb-client:
    build: ./code/influxdb
    container_name: influxdb-client
    command: ["python", "db.py"]
    depends_on:
      influxdb-seed:
        condition: service_completed_successfully
    env_file:
      - ./code/.env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
secrets:
  influxdb2-admin-username:
    file: ~/.env.influxdb2-admin-username
  influxdb2-admin-password:
    file: ~/.env.influxdb2-admin-password
  influxdb2-admin-token:
    file: ~/.env.influxdb2-admin-token
volumes:
  influxdb2-data:
  influxdb2-config:
  chromadb-data:
  chromadb-onnx-cache: